[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-steward"
version = "0.4.2"
description = "Guarded photo mirroring coordinator for macOS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["tomli>=2.0.1; python_version < '3.11'"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: Apache Software License",
]
keywords = ["backup", "icloud", "macos", "photos", "sync"]

[project.scripts]
photo-steward = "tools.icloud_photo_sync.cli:main"
# Retained for existing shell scripts and private installations.
icloud-photo-sync = "tools.icloud_photo_sync.cli:main"

[tool.setuptools.packages.find]
include = ["tools.icloud_photo_sync*"]
namespaces = true

[tool.setuptools.package-data]
"tools.icloud_photo_sync" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
