[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-photo-sync"
version = "0.2.0"
description = "Guarded local iCloud Photos mirror service for macOS"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
icloud-photo-sync = "tools.icloud_photo_sync.cli:main"

[tool.setuptools.packages.find]
include = ["tools.icloud_photo_sync*"]
namespaces = true

[tool.setuptools.package-data]
"tools.icloud_photo_sync" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
